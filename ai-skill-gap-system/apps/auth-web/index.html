<!doctype html>
<html lang="vi">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập | SkillGap AI</title>
    <link rel="stylesheet" href="style.css?v=10" />
    <link rel="stylesheet" href="auth.css?v=10" />
    <script src="resources.js?v=10" defer></script>
    <script src="script.js?v=10" defer></script>
    <script src="spider.js?v=10" defer></script>
    <script src="wolf.js?v=10" defer></script>
    <script src="config.js?v=10" defer></script>
    <script src="auth.js?v=10" defer></script>
  </head>

  <body>

    <div class="landscape-scene page-landscape" aria-hidden="true">
      <img class="scene-land scene-day" src="images/background-day.svg?v=clouds-1" alt="" />
      <img class="scene-land scene-night" src="images/background-night.svg?v=clouds-1" alt="" />
      <div class="sky-flight" aria-hidden="true">
        <span class="sky-bat bat-1">
          <span class="flyer-facing">
            <span data-svg="images/bat.svg" aria-hidden="true"></span>
          </span>
        </span>
        <span class="sky-bat bat-2">
          <span class="flyer-facing">
            <span data-svg="images/bat.svg" aria-hidden="true"></span>
          </span>
        </span>
        <span class="sky-bat bat-3">
          <span class="flyer-facing">
            <span data-svg="images/bat.svg" aria-hidden="true"></span>
          </span>
        </span>
        <span class="sky-bat bat-4">
          <span class="flyer-facing">
            <span data-svg="images/bat.svg" aria-hidden="true"></span>
          </span>
        </span>
        <span class="sky-bat bat-5">
          <span class="flyer-facing">
            <span data-svg="images/bat.svg" aria-hidden="true"></span>
          </span>
        </span>
        <span class="sky-bat bat-6">
          <span class="flyer-facing">
            <span data-svg="images/bat.svg" aria-hidden="true"></span>
          </span>
        </span>
        <span class="sky-witch">
          <span class="flyer-facing">
            <img src="images/witch.svg?v=1" alt="" width="3600" height="3400" draggable="false">
          </span>
        </span>
      </div>
    </div>

    <div class="login-shell">
      <!-- Nút Đóng Modal Halloween và quay lại Dashboard -->
      <button id="close-auth-modal-btn" type="button" aria-label="Đóng giao diện đăng nhập" title="Đóng và quay lại trang chính" onclick="try { if (window.parent && window.parent !== window) { window.parent.postMessage({ type: 'CLOSE_HALLOWEEN_MODAL' }, '*'); } else { window.location.href = 'http://localhost:8080'; } } catch(e) { window.location.href = 'http://localhost:8080'; }" style="position:fixed;top:20px;right:24px;z-index:999999;width:44px;height:44px;border-radius:50%;background:rgba(20,20,30,0.85);border:2px solid rgba(255,165,0,0.6);color:#fff;font-size:22px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.7);transition:all 0.25s ease;" onmouseover="this.style.background='rgba(239,68,68,0.9)';this.style.transform='scale(1.1) rotate(90deg)'" onmouseout="this.style.background='rgba(20,20,30,0.85)';this.style.transform='scale(1) rotate(0deg)'">
        ✕
      </button>
      <div class="halloween-vines" id="halloween-vines" aria-hidden="true"></div>
      <main class="login-card" aria-labelledby="login-title">
        <section class="scene-panel" aria-labelledby="welcome-title">
          <div class="landscape-scene" aria-hidden="true">
            <div class="scene-sky-objects">
              <div class="scene-sun"></div>
              <div class="scene-moon"></div>
            </div>
            <img class="scene-land scene-day" src="images/panel-day.svg?v=responsive-1" alt="" />
            <img class="scene-land scene-night" src="images/panel-night.svg?v=responsive-1" alt="" />
            <div class="sky-flight" aria-hidden="true">
              <span class="sky-bat bat-1">
                <span class="flyer-facing">
                  <span data-svg="images/bat.svg" aria-hidden="true"></span>
                </span>
              </span>
              <span class="sky-bat bat-2">
                <span class="flyer-facing">
                  <span data-svg="images/bat.svg" aria-hidden="true"></span>
                </span>
              </span>
              <span class="sky-bat bat-3">
                <span class="flyer-facing">
                  <span data-svg="images/bat.svg" aria-hidden="true"></span>
                </span>
              </span>
            </div>
          </div>
          <div class="summit-stage" aria-hidden="true"></div>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false" aria-label="Bật đêm Halloween">
            <span class="theme-toggle-thumb" aria-hidden="true"></span>
            <span data-svg="images/icon-sun.svg" aria-hidden="true"></span>
            <span data-svg="images/icon-moon.svg" aria-hidden="true"></span>
          </button>
          <div class="scene-copy">
            <h2 id="welcome-title">SkillGap AI</h2>
            <p>Đăng nhập để xem nhu cầu kỹ năng của thị trường lao động cả nước , phát hiện kỹ năng còn thiếu và nhận gợi ý khóa học.</p>
          </div>
        </section>
        <section class="form-panel">
          <!-- View 1: Form Đăng nhập -->
          <div class="auth-view" id="login-view">
            <form class="login-form" id="login-form">
              <h1 id="login-title">Đăng nhập</h1>
              <div class="field">
                <label class="sr-only" for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="Email" autocomplete="username" required />
                <div class="email-owl" id="email-owl" aria-hidden="true">
                  <span data-svg="images/owl.svg" aria-hidden="true"></span>
                </div>
              </div>
              <div class="field password">
                <label class="sr-only" for="password">Mật khẩu</label>
                <input id="password" name="password" type="password" placeholder="Mật khẩu" autocomplete="current-password" required />
                <button class="eye" id="show-password" type="button" aria-label="Hiện mật khẩu" aria-pressed="false" aria-controls="password">
                  <img src="images/icon-eye.svg" alt="" width="18" height="18" />
                </button>
              </div>
              <button class="text-action forgot" id="forgot-password" type="button">Quên mật khẩu?</button>
              <button class="submit" id="login-submit-btn" type="submit">
                <span>Đăng nhập</span> <img src="images/icon-arrow.svg" alt="" width="17" height="17" />
              </button>
              <p class="signup-row">
                <span>Bạn chưa có tài khoản?</span> <button class="text-action" id="signup" type="button">Đăng ký</button>
              </p>
            </form>
          </div>

          <!-- View 2: Form Đăng ký -->
          <div class="auth-view" id="register-view" hidden>
            <form class="register-form" id="register-form">
              <h1 id="register-title">Đăng ký tài khoản</h1>

              <!-- Chọn chức vụ (3 chip) -->
              <span class="role-selector-label">Chọn chức vụ của bạn:</span>
              <div class="role-chips" role="radiogroup" aria-label="Chọn chức vụ">
                <button class="role-chip active" id="chip-worker" type="button" data-role="worker" role="radio" aria-checked="true">
                  <span class="chip-icon">👤</span>
                  <span>Người lao động</span>
                </button>
                <button class="role-chip" id="chip-employer" type="button" data-role="employer" role="radio" aria-checked="false">
                  <span class="chip-icon">🏢</span>
                  <span>Nhà tuyển dụng</span>
                </button>
                <button class="role-chip" id="chip-provider" type="button" data-role="course_provider" role="radio" aria-checked="false">
                  <span class="chip-icon">🎓</span>
                  <span>Đơn vị đào tạo</span>
                </button>
              </div>

              <!-- Trường riêng: Người lao động (worker) -->
              <div class="role-field-group" id="fields-worker">
                <div class="field">
                  <label class="sr-only" for="reg-worker-name">Họ và tên</label>
                  <input id="reg-worker-name" name="full_name" type="text" placeholder="Họ và tên" />
                </div>
              </div>

              <!-- Trường riêng: Nhà tuyển dụng (employer) -->
              <div class="role-field-group" id="fields-employer" hidden>
                <div class="field">
                  <label class="sr-only" for="reg-company-name">Tên công ty</label>
                  <input id="reg-company-name" name="company_name" type="text" placeholder="Tên công ty" />
                </div>
                <div class="field">
                  <label class="sr-only" for="reg-contact-name">Tên người liên hệ</label>
                  <input id="reg-contact-name" name="contact_name" type="text" placeholder="Tên người liên hệ" />
                </div>
                <div class="field">
                  <label class="sr-only" for="reg-phone">Số điện thoại</label>
                  <input id="reg-phone" name="phone" type="tel" placeholder="Số điện thoại liên hệ" />
                </div>
              </div>

              <!-- Trường riêng: Nhà đăng khóa học (course_provider) -->
              <div class="role-field-group" id="fields-provider" hidden>
                <div class="field">
                  <label class="sr-only" for="reg-provider-name">Tên đơn vị đào tạo</label>
                  <input id="reg-provider-name" name="provider_name" type="text" placeholder="Tên đơn vị đào tạo" />
                </div>
                <div class="field">
                  <label class="sr-only" for="reg-website">Website (không bắt buộc)</label>
                  <input id="reg-website" name="website" type="url" placeholder="Website (không bắt buộc)" />
                </div>
                <div class="field">
                  <label class="sr-only" for="reg-description">Mô tả (không bắt buộc)</label>
                  <textarea id="reg-description" name="description" placeholder="Mô tả ngắn về đơn vị đào tạo (không bắt buộc)"></textarea>
                </div>
              </div>

              <!-- Trường chung -->
              <div class="field">
                <label class="sr-only" for="reg-email">Email</label>
                <input id="reg-email" name="email" type="email" placeholder="Email" autocomplete="username" required />
              </div>

              <div class="field password">
                <label class="sr-only" for="reg-password">Mật khẩu</label>
                <input id="reg-password" name="password" type="password" placeholder="Mật khẩu (tối thiểu 8 ký tự)" autocomplete="new-password" required />
                <button class="eye toggle-reg-pwd" type="button" data-target="reg-password" aria-label="Hiện mật khẩu">
                  <img src="images/icon-eye.svg" alt="" width="18" height="18" />
                </button>
              </div>

              <div class="field password">
                <label class="sr-only" for="reg-password-confirm">Nhập lại mật khẩu</label>
                <input id="reg-password-confirm" name="password_confirm" type="password" placeholder="Nhập lại mật khẩu" autocomplete="new-password" required />
                <button class="eye toggle-reg-pwd" type="button" data-target="reg-password-confirm" aria-label="Hiện mật khẩu">
                  <img src="images/icon-eye.svg" alt="" width="18" height="18" />
                </button>
              </div>

              <button class="submit" id="register-submit-btn" type="submit">
                <span>Tạo tài khoản</span> <img src="images/icon-arrow.svg" alt="" width="17" height="17" />
              </button>

              <p class="signup-row">
                <span>Bạn đã có tài khoản?</span> <button class="text-action" id="to-login" type="button">Đăng nhập</button>
              </p>
            </form>
          </div>

          <!-- Thông báo trạng thái dùng chung -->
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </section>
      </main>
    </div>

    <canvas id="halloween-spider" aria-hidden="true"></canvas>

    <div class="flash-beam" id="flash-beam" aria-hidden="true"></div>

    <div class="password-reveal" id="password-reveal" aria-hidden="true">
      <span id="reveal-text"></span>
    </div>

    <div class="flashlight" id="flashlight" aria-hidden="true">
      <img src="images/flashlight.svg" alt="" width="33" height="33" />
    </div>
    
  </body>

</html>
